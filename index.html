const DEFAULT={schemaVersion:1,overrides:{},custom:[],hidden:[],progress:{},favorites:[],notes:{},history:[],daily:{},settings:{largeText:false,dictTarget:'_blank'},ui:{view:'home',lastId:'',lastDeck:[],returnView:'home',category:'전체',filter:'all',search:'',phonTab:'initials',initial:'b',final:'a',noteTab:'favorites',reviewMode:'hanzi',reviewFilter:'all',reviewCategory:'전체',reviewCount:'10',scrollPosition:{hash:'',y:0}},reviewSession:null,quizResult:null};

function hydrateState(input){
 const x=safeObj(input),s=clone(DEFAULT);
 if(x.schemaVersion!==1)throw Error('지원하지 않는 저장 데이터 버전입니다.');
 s.custom=Array.isArray(x.custom)?x.custom.map(validateEntry):[];
 for(const [k,v]of Object.entries(safeObj(x.overrides))){if(validID(k))s.overrides[k]=validateEntry({...v,id:k});}
 s.hidden=Array.isArray(x.hidden)?x.hidden.filter(validID):[];
 s.favorites=Array.isArray(x.favorites)?x.favorites.filter(validID):[];
 for(const [k,v]of Object.entries(safeObj(x.notes))){if(validID(k)&&typeof v==='string')s.notes[k]=v.slice(0,10000);}
 for(const [k,v]of Object.entries(safeObj(x.progress))){
  if(!validID(k)||!v||typeof v!=='object')continue;
  s.progress[k]={status:['known','review'].includes(v.status)?v.status:'new',count:Math.min(100000,Math.max(0,Number(v.count)||0)),interval:Math.min(365,Math.max(0,Number(v.interval)||0)),due:Number.isFinite(v.due)?v.due:0,updatedAt:Number.isFinite(v.updatedAt)?v.updatedAt:0};
 }
 s.history=Array.isArray(x.history)?x.history.filter(validID).slice(0,100):[];
 for(const [k,v]of Object.entries(safeObj(x.daily))){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isFinite(v))s.daily[k]=Math.max(0,Math.min(v,100000));}

 const u=safeObj(x.ui);for(const k of Object.keys(s.ui)){if(typeof u[k]===typeof s.ui[k])s.ui[k]=u[k];}

 const r=safeObj(x.reviewSession);

 return s;
}

function rebuild(){
 const seen=new Set(),hidden=new Set(S.hidden);entries=[];
 for(const item of [...SEED,...S.custom]){const e=S.overrides[item.id]||item;if(seen.has(e.id)||hidden.has(e.id))continue;seen.add(e.id);entries.push(e);}

function persist(){
 if(suppressPersist)return storageOkay;
 try{if(rawRecovery){localStorage.setItem(STORE_KEY+'-recovery',rawRecovery);rawRecovery='';}localStorage.setItem(STORE_KEY,JSON.stringify(S));storageOkay=true;storageMessage='';}
 catch(err){storageOkay=false;storageMessage='브라우저에 저장하지 못했습니다. 현재 화면은 사용할 수 있지만 종료 전 JSON 백업을 해 주세요.';}
 refreshStorageUI();return storageOkay;
}

const TONES={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function markSyllable(s){
 let t=s.toLowerCase().replace(/u:/g,'ü').replace(/v/g,'ü').normalize('NFC');
 const m=t.match(/^([a-zü]+)([0-5])$/);if(!m)return t;
 let [_,base,n]=m;n=+n;if(n===0||n===5)return base;
 let i=base.indexOf('a');if(i<0)i=base.indexOf('e');if(i<0)i=base.indexOf('o');
 if(i<0){for(let j=base.length-1;j>=0;j--){if('iuü'.includes(base[j])){i=j;break;}}}
 if(i<0)return base;return base.slice(0,i)+TONES[base[i]][n-1]+base.slice(i+1);
}
function tokenizePinyin(p){return String(p).trim().replace(/[，。！？、；：,.!?;:]/g,' ').replace(/[’'|·]/g,' ').split(/\s+/).filter(Boolean).map(markSyllable);}
function cleanSyllable(s){let out='',tone=0;for(const ch of String(s).toLowerCase().normalize('NFC')){let found=false;for(const [v,marks]of Object.entries(TONES)){const k=marks.indexOf(ch);if(k>=0){out+=v;tone=k+1;found=true;break;}}if(!found)out+=ch;}return{plain:out,tone};}
function searchKey(s){return cleanSyllable(tokenizePinyin(String(s)).join('')).plain.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[\s’'·？。！?!,，]/g,'');}

function unitsFor(hanzi,syllables){

}
function validateEntry(v){

 if(!e.hanzi||!e.pinyin||!e.meaning)throw Error('한자, 병음, 뜻은 필수입니다.');
 const tokens=tokenizePinyin(e.pinyin);if(tokens.some(s=>!/^([a-züêāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+)$/i.test(s)))throw Error('병음은 음절 사이를 공백으로 나누어 주세요. 예: nǐ hǎo 또는 ni3 hao3');
 if(!unitsFor(e.hanzi,tokens))throw Error(`한자와 병음의 음절 수가 맞지 않습니다: ${e.hanzi}. 한 글자마다 공백으로 나누어 주세요.`);
 e.pinyin=tokens.join(' ');e.category=e.category||'내 표현';
 if(e.dictionaryUrl&&!safeNaverURL(e.dictionaryUrl))throw Error('사전 주소는 https:// 로 시작하는 네이버 사전 주소만 등록할 수 있습니다.');
 e.examples=Array.isArray(v.examples)?v.examples.slice(0,30).map(x=>({hanzi:String(x.hanzi||'').slice(0,200),pinyin:String(x.pinyin||'').slice(0,700),meaning:String(x.meaning||'').slice(0,600)})):[];
 e.tags=Array.isArray(v.tags)?v.tags.filter(x=>typeof x==='string').map(x=>x.slice(0,30)).slice(0,20):[];
 if(Array.isArray(v.baseReadings)&&v.baseReadings.length===tokens.length)e.baseReadings=v.baseReadings.map(x=>String(x).slice(0,20));
 e.related=Array.isArray(v.related)?v.related.filter(r=>validID(r.id)).map(r=>({id:r.id,kind:String(r.kind||'관련 표현').slice(0,25)})).slice(0,30):[];
 return e;
}

function phonTabs(){const arr=[['initials','성모'],['finals','운모'],['tones','성조'],['compare','비교 연습'],['rules','표기 규칙'],['quiz','발음 퀴즈']];return `<div class="segmented" aria-label="발음 학습 주제">${arr.map(([key,t])=>`<button data-action="phontab" data-tab="${key}" class="${S.ui.phonTab===key?'active':''}" aria-pressed="${S.ui.phonTab===key}">${t}</button>`).join('')}</div>`;}
function renderSound(type){const initial=type==='initials',arr=initial?INITIALS:FINALS,key=initial?S.ui.initial:S.ui.final,selected=arr.find(x=>x[0]===key)||arr[0];return `<div class="section-intro" style="margin-top:22px"><h2>${initial?'음절을 여는 21개의 성모':'모음과 끝소리를 한 덩어리로'}</h2><p class="small">${initial?'소리를 선택하면 혀의 위치와 바람의 차이를 볼 수 있어요.':'운모를 선택해 입모양과 n·ng 끝소리를 함께 확인하세요.'}</p></div><div class="lesson-layout"><div class="sound-grid">${arr.map(x=>`<button class="sound-btn ${selected[0]===x[0]?'active':''}" data-action="sound-select" data-type="${type}" data-key="${esc(x[0])}" aria-pressed="${selected[0]===x[0]}"><strong>${esc(x[0])}</strong><span lang="zh-Hans">${esc(x[1])} <span style="display:inline;font-family:var(--sans)">${esc(x[2])}</span></span></button>`).join('')}</div><div class="sound-detail" id="selected-sound"><div class="between"><div class="sound-large">${esc(selected[0])}</div><span class="badge">${initial?esc(selected[3]):'운모'}</span></div><p>${esc(selected[initial?4:3])}</p><div class="sample-row"><span class="sample-token"><span class="cn" lang="zh-Hans">${esc(selected[1])}</span><span class="pinyin">${esc(selected[2])}</span></span>${dictLink(selected[1],'예시 발음 확인','btn secondary sm')}</div><div class="lesson-tip">성모 알파벳을 영어로 읽는 것이 아닙니다. 예시 한자의 실제 발음을 사전에서 확인하세요. 한글 설명은 발음을 잡기 위한 근사치입니다.</div>${sourceLink()}</div></div>${initial?`<div class="lesson-block"><h3>먼저 익힐 세 가지 차이</h3><p><strong>바람:</strong> b–p, d–t, g–k, j–q, zh–ch, z–c에서 뒤쪽 소리는 유기음입니다.<br><strong>혀 위치:</strong> z·c·s는 앞쪽, zh·ch·sh는 혀끝을 위로, j·q·x는 혀끝은 아래에 두고 혀 앞부분을 위로 둡니다.<br><strong>y·w:</strong> 이 앱에서는 성모 21개와 구분하고, 성모가 없는 음절의 표기로 설명합니다.</p></div>`:`<div class="lesson-block"><h3>글자와 실제 소리를 구분하기</h3><p><strong>i:</strong> nǐ의 i와 zī·zhī의 i는 같은 소리가 아닙니다.<br><strong>e:</strong> hē의 e와 xiè의 ie 안 e는 실제 소리가 다릅니다.<br><strong>n·ng:</strong> 혀끝과 혀 뒤쪽으로 끝소리를 구분합니다. ng의 g를 따로 터뜨리지 않습니다.</p></div>`}`;}
function toneSVG(t){const d={1:'M12 14 H108',2:'M12 43 Q50 43 108 11',3:'M12 33 Q43 61 61 54 Q79 45 108 21',4:'M12 11 L108 56',0:'M35 35 L85 35'}[t];return `<svg class="tone-diagram" viewBox="0 0 120 65" role="img" aria-label="${t||'경'}성의 개략적인 음높이 모양"><path class="gridline" d="M8 13H112M8 35H112M8 57H112"/><path d="${d}"/></svg>`;}
function lessonBlock(title,body){return `<section class="lesson-block"><h3>${title}</h3>${body}</section>`;}
function renderTones(){const data=[[1,'mā','妈','높은 음을 일정하게'],[2,'má','麻','중간에서 위로 올리기'],[3,'mǎ','马','단독 기본형: 낮게 갔다 올리기'],[4,'mà','骂','높은 곳에서 내려가기'],[0,'ma','吗','짧고 가볍게 · 앞 음절의 영향']];return `<div class="section-intro" style="margin-top:22px"><h2>같은 소리, 다른 높낮이</h2><p class="small">그림은 발음의 개략적인 모양입니다. 절대적인 음높이나 길이는 아닙니다.</p></div><div class="tone-grid">${data.map(([n,p,h,note])=>`<div class="tone-card"><h3>${n?n+'성':'경성'}</h3><div class="tone-sample">${p}</div>${toneSVG(n)}<p>${note}</p>${dictLink(h,h+' 발음','btn text sm')}</div>`).join('')}</div>${lessonBlock('성조와 성조부호는 다릅니다','<p><strong>성조</strong>는 실제 음높이의 움직임이고, <strong>성조부호</strong>는 이를 글로 적는 표시입니다. 부호는 모음 하나 위에 적지만, 성조는 음절 전체의 높낮이입니다.</p>')}${lessonBlock('3성은 항상 크게 꺾어 올리지 않습니다','<p>단독으로 또렷하게 읽는 3성의 기본형은 낮게 내려갔다가 올라옵니다. 문장에서는 낮은 부분만 나타나는 경우가 많습니다. 특히 1·2·4성 앞에서는 매번 올리는 발음을 과장하지 않습니다.</p><div class="lesson-tip"><strong>3성 + 3성 → 앞 음절을 2성으로</strong><br>你好: nǐ hǎo → ní hǎo<br>有礼貌: yǒu lǐ mào → yóu lǐ mào<br>下午好: xià wǔ hǎo → xià wú hǎo<br><br>3성이 세 개 이상이면 말의 묶음과 경계가 중요합니다. 무조건 마지막만 빼고 전부 2성으로 바꾸지 마세요.</div>')}${lessonBlock('不와 一의 이어 읽기','<table class="lesson-mini-table"><thead><tr><th>규칙</th><th>예시</th></tr></thead><tbody><tr><td>不 + 4성 → bú</td><td class="pinyin">不贵: bú guì<br>不客气: bú kè qi</td></tr><tr><td>不 + 1·2·3성 → bù</td><td class="pinyin">不忙: bù máng<br>不渴: bù kě</td></tr><tr><td>一 + 4성 → yí</td><td class="pinyin">一下: yí xià<br>一遍: yí biàn</td></tr><tr><td>一 + 1·2·3성 → yì</td><td class="pinyin">一天: yì tiān<br>一年: yì nián</td></tr></tbody></table><p>一를 단독으로 읽거나 서수로 사용할 때는 기본 yī를 씁니다. 对不起의 bu처럼 고정 표현에서 경성으로 읽는 경우도 별도로 익힙니다.</p>')}${lessonBlock('경성은 소리가 없는 것이 아닙니다','<p>짧고 가볍게 읽으며, 실제 높이는 앞 음절의 영향을 받습니다. 谢谢의 두 번째 xie, 我们의 men, 辛苦了의 le가 예입니다.<br><br>이 앱의 학습 병음은 경성에 부호를 붙이지 않습니다. 다만 검색창에 성조를 생략해 쓴 hao, mang 등을 경성이라고 판단하는 것은 아닙니다.</p>')}${sourceLink()}`;}
function renderCompare(){return `<div class="section-intro" style="margin-top:22px"><h2>한 가지 차이에 집중해 보세요.</h2><p class="small">두 예시를 사전에서 번갈아 듣고, 소리 내어 따라 읽으세요.</p></div><div class="compare-grid">${COMPARISONS.map(c=>`<section class="compare-card"><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p><div class="compare-pair"><div class="compare-word"><div class="cn" lang="zh-Hans">${esc(c[2])}</div><div class="pinyin">${esc(c[3])}</div><div class="small">${esc(c[4])}</div>${dictLink(c[2],'사전 듣기','btn text sm')}</div><span class="muted">↔</span><div class="compare-word"><div class="cn" lang="zh-Hans">${esc(c[5])}</div><div class="pinyin">${esc(c[6])}</div><div class="small">${esc(c[7])}</div>${dictLink(c[5],'사전 듣기','btn text sm')}</div></div><div class="compare-note">${esc(c[8])}</div></section>`).join('')}</div>${sourceLink()}`;}
function renderRules(){return `<div class="section-intro" style="margin-top:22px"><h2>병음을 읽는 작은 규칙들</h2><p class="small">철자 하나씩이 아니라, 음절 전체로 이해합니다.</p></div>${lessonBlock('01 · 성모 + 운모 + 성조','<p><strong>好 hǎo = 성모 h + 운모 ao + 3성.</strong><br>성모는 음절을 시작하는 자음입니다. 운모는 성모를 제외한 나머지 소리로, 모음이나 모음과 n·ng 끝소리가 포함될 수 있습니다.<br>爱 ài처럼 성모가 없는 음절도 있습니다. sh·zh·ch는 각각 하나의 성모입니다.</p>')}${lessonBlock('02 · 성조부호를 붙이는 위치','<table class="lesson-mini-table"><thead><tr><th>순서</th><th>규칙</th><th>예시</th></tr></thead><tbody><tr><td>1</td><td>a가 있으면 a 위에</td><td class="pinyin">hǎo · kuài</td></tr><tr><td>2</td><td>a가 없으면 o 또는 e 위에</td><td class="pinyin">dōu · lèi · xiè</td></tr><tr><td>3</td><td>iu·ui는 뒤의 모음 위에</td><td class="pinyin">liù · guì</td></tr><tr><td>4</td><td>모음 하나면 그 모음 위에</td><td class="pinyin">nǐ · bù · nǚ</td></tr></tbody></table><div class="lesson-tip">i의 점은 부호를 붙이면 없어집니다: ī í ǐ ì<br>ü의 두 점은 모음을 구분하는 표시입니다: ǖ ǘ ǚ ǜ</div>')}${lessonBlock('03 · ü의 두 점이 사라지는 경우','<p><strong>j·q·x 뒤:</strong> ü → u로 표기합니다. 去 qù = q + ü, 学 xué = x + üe, 全 quán = q + üan입니다.<br><strong>n·l 뒤:</strong> 두 점을 유지합니다. 女 nǚ, 绿 lǜ.<br><strong>성모가 없을 때:</strong> yu·yue·yuan·yun으로 표기합니다. 语 yǔ는 ü 계열입니다.</p>')}${lessonBlock('04 · 축약된 운모를 복원하기','<table class="lesson-mini-table"><thead><tr><th>운모</th><th>성모 뒤 표기</th><th>예시</th></tr></thead><tbody><tr><td>iou</td><td>iu</td><td class="pinyin">九 jiǔ</td></tr><tr><td>uei</td><td>ui</td><td class="pinyin">贵 guì · 对 duì</td></tr><tr><td>uen</td><td>un</td><td class="pinyin">困 kùn</td></tr></tbody></table><p><strong>주의:</strong> 群 qún·军 jūn의 un은 uen이 아니라 ün입니다. 앞 성모까지 함께 확인하세요.</p>')}${lessonBlock('05 · y·w로 시작하는 표기','<table class="lesson-mini-table"><thead><tr><th>표기</th><th>대응 운모</th><th>예시</th></tr></thead><tbody><tr><td>yi / you / ye</td><td>i / iou / ie</td><td class="pinyin">一 yī · 有 yǒu · 也 yě</td></tr><tr><td>wu / wo / wen</td><td>u / uo / uen</td><td class="pinyin">午 wǔ · 我 wǒ · 问 wèn</td></tr><tr><td>yu / yue / yun</td><td>ü / üe / ün</td><td class="pinyin">鱼 yú · 月 yuè · 云 yún</td></tr></tbody></table><p>이 앱은 y·w를 정식 21개 성모와 구분하는 방식으로 분석합니다.</p>')}${lessonBlock('06 · 작은따옴표와 음절 경계','<p><strong>可爱 kě’ài, 晚安 wǎn’ān:</strong> 작은따옴표는 성조가 아니라 음절 경계를 나타내는 격음부호입니다. 뒤 음절이 a·o·e로 시작할 때 경계가 혼동되지 않도록 씁니다.<br><br>앱의 카드와 분석표는 글자별 대응을 쉽게 보기 위해 병음을 음절별 공백으로 표시합니다. 일반 문장 병음의 띄어쓰기와는 구분하세요.</p>')}${lessonBlock('07 · 글자 단독과 단어 속 독음','<p><strong>谢 xiè → 谢谢 xiè xie:</strong> 같은 글자가 단어 안에서 경성으로 읽힐 수 있습니다.<br><strong>好 hǎo / hào:</strong> 한 글자가 뜻과 문맥에 따라 여러 독음을 가질 수 있습니다.<br><br>앱은 등록된 병음을 분석합니다. 새로운 한자에 독음을 임의로 붙이거나 문장 전체의 성조 변화를 자동 확정하지 않습니다.</p>')}${sourceLink()}`;}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderQuiz(){
 if(!quiz)return `<div class="qa-box"><div class="eyebrow">CHECK YOUR BASICS</div><h3>발음 규칙, 얼마나 기억하나요?</h3><p class="small muted">매번 8문제를 골라 연습합니다. 답을 고르면 이유를 바로 확인할 수 있어요. 음성을 인식하거나 발음을 채점하는 기능은 아닙니다.</p>${S.quizResult?`<div class="tipbox" style="margin-top:16px">지난 결과: ${S.quizResult.correct} / ${S.quizResult.total} 정답</div>`:''}<button class="btn primary full" data-action="quiz-start" style="margin-top:24px">8문제 시작하기${icon('arrow')}</button></div>`;
 if(quiz.index>=quiz.ids.length)return `<div class="qa-box session-result"><span class="icon-btn">${icon('check')}</span><h2>${quiz.correct} / ${quiz.ids.length}</h2><p>헷갈렸던 규칙을 확인하고 다시 연습해 보세요.</p><button class="btn primary" data-action="quiz-start">다시 연습하기</button><button class="btn text" data-action="phontab" data-tab="rules">표기 규칙 보기</button></div>`;
 const q=QUIZ_QUESTIONS[quiz.ids[quiz.index]],answered=quiz.answer!==null;
 return `<div class="qa-box"><div class="between"><span class="eyebrow">PRONUNCIATION QUIZ</span><span class="small muted">${quiz.index+1} / ${quiz.ids.length}</span></div><h3>${esc(q[0])}</h3><div class="quiz-answers">${q[1].map((a,i)=>`<button class="answer ${answered?(i===q[2]?'correct':i===quiz.answer?'wrong':''):''}" data-action="quiz-answer" data-index="${i}" ${answered?'disabled':''}>${esc(a)}</button>`).join('')}</div>${answered?`<div class="quiz-feedback ${quiz.answer===q[2]?'':'wrong'}"><strong>${quiz.answer===q[2]?'정답입니다.':'이 부분을 다시 기억해 주세요.'}</strong>${esc(q[3])}</div><button class="btn primary full" style="margin-top:17px" data-action="quiz-next">${quiz.index===quiz.ids.length-1?'결과 보기':'다음 문제'}${icon('arrow')}</button>`:''}</div>`;
}
function renderPhonetics(){const tab=S.ui.phonTab;if(!['initials','finals','tones','compare','rules','quiz'].includes(tab))S.ui.phonTab='initials';const content=tab==='initials'||tab==='finals'?renderSound(tab):tab==='tones'?renderTones():tab==='compare'?renderCompare():tab==='quiz'?renderQuiz():renderRules();const noteKey='lesson:'+S.ui.phonTab;return `<div class="page-head"><div><div class="eyebrow">PRONUNCIATION STUDIO</div><h1 style="margin-top:6px">발음의 기초</h1><p>혀 위치, 입모양, 높낮이를 하나씩 익혀보세요.</p></div></div>${phonTabs()}${content}${tab!=='quiz'?`<details class="lesson-block"><summary style="cursor:pointer;font-weight:650">${icon('note')} 이 주제의 학습 메모</summary><textarea style="margin-top:15px" class="memo" data-memo="${noteKey}" aria-label="발음 학습 메모" placeholder="수업에서 배운 내용이나 헷갈리는 부분을 적으세요.">${esc(S.notes[noteKey]||'')}</textarea><div class="memo-status">입력한 내용은 이 브라우저에 자동 저장됩니다.</div></details>`:''}`;}
function reviewPool(filter,category){return entries.filter(e=>{
 if(category&&category!=='전체'&&e.category!==category)return false;
 if(filter==='favorites')return S.favorites.includes(e.id);
 if(filter==='review')return status(e.id)==='review';
 if(filter==='due')return S.progress[e.id]?.due&&S.progress[e.id].due<=now();
 return e.category!=='발음 예시';
});}
function renderReview(){
 const r=S.reviewSession,c=counters();
 if(r){
  r.ids=r.ids.filter(id=>entryMap.has(id));
  if(r.index>=r.ids.length)return `<div class="review-session"><div class="card session-result"><span class="icon-btn">${icon('check')}</span><div class="eyebrow">ONE STEP FORWARD</div><h2 style="margin-top:8px">오늘도 한 걸음.</h2><p>${r.ids.length}개 표현을 복습했어요.<br>기억나는 표현 ${r.known}개 · 다시 볼 표현 ${r.again}개</p><button class="btn primary" data-action="review-end">복습 마치기${icon('check')}</button><button class="btn text" data-action="review-another">다른 표현 복습하기</button></div><p class="review-hint">직접 평가한 학습 기록이며 TSC 공식 채점이 아닙니다.</p></div>`;
  const e=entryMap.get(r.ids[r.index]),pct=Math.round(r.index/r.ids.length*100);
  return `<div class="review-session"><div class="between"><button class="btn text" data-action="review-pause">${icon('back')}잠시 나가기</button><span class="badge">${r.mode==='meaning'?'뜻 보고 말하기':'한자 보고 말하기'}</span></div><div class="review-counter">${r.index+1} / ${r.ids.length} 표현</div><div class="progress-track" role="progressbar" aria-label="현재 복습 진행" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><article class="flashcard" style="margin-top:20px"><span class="eyebrow" style="margin-bottom:17px">소리 내어 말해 보세요</span><div class="${r.mode==='hanzi'?'flash-zh cn':'flash-ko'}" ${r.mode==='hanzi'?'lang="zh-Hans"':''}>${esc(r.mode==='hanzi'?e.hanzi:e.meaning)}</div>${r.revealed?`<div class="reveal-area">${r.mode==='meaning'?`<div class="flash-zh cn" lang="zh-Hans">${esc(e.hanzi)}</div>`:''}<div class="pinyin">${esc(e.pinyin)}</div>${r.mode==='hanzi'?`<div class="reveal-meaning">${esc(e.meaning)}</div>`:''}${e.reading?`<div class="connected">이어 읽기 <strong>${esc(e.reading)}</strong></div>`:''}<p class="flash-note">${esc(e.note)}</p><div style="margin-top:19px">${dictLink(e.hanzi,'네이버에서 확인','btn soft',e)}</div></div>`:'<p class="small muted" style="margin-top:22px">병음과 뜻은 정답 확인 후 나타납니다.</p>'}</article><div class="review-controls">${r.revealed?'<button class="btn secondary" data-action="review-grade" data-grade="again">'+icon('repeat')+'다시 볼게요</button><button class="btn primary" data-action="review-grade" data-grade="known">'+icon('check')+'기억나요</button>':'<button class="btn primary full" data-action="review-reveal">'+icon('eye')+'정답 확인</button>'}</div><p class="review-hint">다시 볼 표현은 약 10분 뒤, 기억한 표현은 1 → 3 → 7 → 14 → 30일 간격으로 제안합니다.<br>이 앱의 간단한 복습 규칙이며 시험 점수 예측 기능은 아닙니다.</p></div>`;

 const config={filter:S.ui.reviewFilter||'all',category:S.ui.reviewCategory||'전체',count:S.ui.reviewCount||'10'};
 return `<div class="page-head"><div><div class="eyebrow">ACTIVE RECALL</div><h1 style="margin-top:6px">꺼내보는 연습</h1><p>먼저 말해 보고, 병음과 뜻을 확인하세요.</p></div></div><section class="review-hero"><h2>눈으로 아는 것에서,<br>입으로 말할 수 있는 것으로.</h2><p>오늘 복습할 표현 ${c.due}개 · 다시 볼 표현 ${c.review}개<br>몇 분의 짧은 복습으로 기억을 이어가세요.</p></section><section class="review-options card"><h3>어떻게 복습할까요?</h3><div class="segmented" style="margin-top:17px"><button data-action="review-mode" data-mode="hanzi" class="${S.ui.reviewMode==='hanzi'?'active':''}">한자 보고 말하기</button><button data-action="review-mode" data-mode="meaning" class="${S.ui.reviewMode==='meaning'?'active':''}">뜻 보고 말하기</button></div><div class="review-option-grid"><div class="field"><label for="review-filter">복습할 목록</label><select id="review-filter">${[['all','기본 단어·표현'],['favorites','즐겨찾기'],['review','다시 볼 표현'],['due','오늘 복습할 표현']].map(([k,t])=>`<option value="${k}" ${config.filter===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="review-count">표현 수</label><select id="review-count">${['5','10','20','all'].map(k=>`<option value="${k}" ${config.count===k?'selected':''}>${k==='all'?'전체':k+'개'}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label for="review-category">분류</label><select id="review-category">${['전체',...allCategories()].map(k=>`<option ${config.category===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div></div><button class="btn primary full" data-action="review-start">복습 시작하기${icon('arrow')}</button><p class="small muted" style="font-size:11px;margin-top:13px">기본 목록은 단어·회화 중심입니다. 발음 원리는 ‘발음 퀴즈’에서 따로 점검하세요.</p></section><button class="note-link" style="width:100%;text-align:left" data-action="phontab" data-tab="quiz">${icon('wave')}<span><strong style="color:var(--ink)">발음 규칙도 확인해 볼까요?</strong><br>성모·운모·성조 8문제 퀴즈</span><span style="margin-left:auto">${icon('arrow')}</span></button>`;

function startReview(){const filter=$('#review-filter')?.value||'all',count=$('#review-count')?.value||'10',category=$('#review-category')?.value||'전체';S.ui.reviewFilter=filter;S.ui.reviewCount=count;S.ui.reviewCategory=category;const pool=reviewPool(filter,category);if(!pool.length){toast('이 목록에 복습할 표현이 없습니다. 다른 목록을 선택해 주세요.');return;}const ids=shuffled(pool.map(e=>e.id)).slice(0,count==='all'?pool.length:Number(count));S.reviewSession={ids,index:0,mode:S.ui.reviewMode,revealed:false,again:0,known:0,startedAt:now()};persist();render();window.scrollTo(0,0);}
function reviewGrade(grade){const r=S.reviewSession;if(!r||!r.revealed||r.index>=r.ids.length)return;const id=r.ids[r.index],p=S.progress[id]||{},known=grade==='known';const interval=known?(!p.interval?1:p.interval<3?3:p.interval<7?7:p.interval<14?14:30):0;S.progress[id]={status:known?'known':'review',count:(p.count||0)+1,interval,due:now()+(known?interval*86400000:600000),updatedAt:now()};S.daily[dayKey()]=(S.daily[dayKey()]||0)+1;if(known)r.known++;else r.again++;r.index++;r.revealed=false;persist();render();window.scrollTo(0,0);}
function renderManage(){return `<div class="manage-grid"><section class="manage-card card"><div class="manage-icon">${icon('download')}</div><h3>전체 백업</h3><p>학습 내용, 직접 추가한 표현, 즐겨찾기, 메모와 복습 기록까지 JSON 파일 하나에 담습니다.</p><button class="btn primary" data-action="backup">${icon('download')}전체 백업 내려받기</button></section><section class="manage-card card"><div class="manage-icon">${icon('upload')}</div><h3>내용 추가 · 복원</h3><p>새 학습 자료는 미리 확인한 뒤 합칩니다. 기존 메모와 복습 기록은 그대로 유지됩니다. 전체 백업 복원은 별도 선택입니다.</p><button class="btn secondary" data-action="import">${icon('upload')}파일 또는 텍스트 가져오기</button></section><section class="manage-card card"><div class="manage-icon">${icon('book')}</div><h3>학습 내용만 내보내기</h3><p>개인 메모와 복습 이력을 제외한 표현 자료를 내보냅니다. 다른 곳에서 정리한 내용을 다시 가져올 때도 같은 형식을 쓸 수 있습니다.</p><div class="row" style="flex-wrap:wrap"><button class="btn secondary" data-action="export-pack">학습 자료 내보내기</button><button class="btn text" data-action="template">추가용 예시 파일</button></div></section><section class="manage-card card"><div class="manage-icon">${icon('settings')}</div><h3>읽기와 사전 연결</h3><div class="settings-row"><label for="large-text">큰 글씨<small>한자·병음과 본문을 더 크게</small></label><input id="large-text" type="checkbox" ${S.settings.largeText?'checked':''} style="width:22px;height:22px;accent-color:var(--green)"></div><div class="settings-row"><label for="dict-target">사전 열기<small>새 탭 또는 현재 탭</small></label><select id="dict-target"><option value="_blank" ${S.settings.dictTarget==='_blank'?'selected':''}>새 탭</option><option value="_self" ${S.settings.dictTarget==='_self'?'selected':''}>현재 탭</option></select></div></section></div>
 <section class="lesson-block"><h3>${icon('shield')} 저장과 사용 안내</h3><div class="tipbox">이 앱에는 로그인·서버 동기화·자동 음성 채점이 없습니다. 기록은 이 브라우저에 저장됩니다. 사전 연결에는 인터넷이 필요합니다.</div><details class="help-detail"><summary>휴대폰에서 사용하기</summary><p>실제 브라우저에서 JavaScript를 실행해야 버튼이 동작합니다. 파일 미리보기 화면에서는 작동하지 않을 수 있습니다. 휴대폰에서 고정된 주소로 쓰려면 이 HTML 파일을 정적 웹 호스팅에 배포해야 합니다. 파일 제공과 인터넷 주소 배포는 별개입니다. 이 버전은 서비스 워커나 앱 설치 기능을 포함하지 않습니다.</p></details><details class="help-detail"><summary>기기 변경 또는 브라우저 초기화 전</summary><p>전체 백업을 내려받아 보관해 주세요. 브라우저 데이터를 지우거나 다른 브라우저·주소에서 열면 기존 기록이 보이지 않을 수 있습니다. 로컬 파일(file:) 저장 동작은 브라우저마다 다를 수 있습니다. 휴대폰과 PC의 기록은 자동으로 동기화되지 않습니다.</p></details><details class="help-detail"><summary>네이버에서 듣기 버튼이 하는 일</summary><p>등록된 상세 항목 주소가 있으면 그 항목을, 없으면 해당 한자나 단어의 검색 결과를 엽니다. 이동 후 네이버의 발음 버튼을 직접 눌러 주세요. 이 앱이 네이버 음원을 복사하거나 자동 재생하지는 않습니다. 긴 문장이나 일부 항목에는 발음이 없을 수 있습니다. 제작 환경에서는 네이버의 실제 모바일 페이지 재생까지 확인하지 못했습니다. 검색 결과에서 올바른 독음을 확인하고 정확한 항목 주소를 표현 수정 화면에 저장할 수 있습니다.</p></details><details class="help-detail"><summary>내가 추가한 병음은 어떻게 분석되나요?</summary><p>입력한 병음을 음절별로 분해합니다. 한자에서 독음을 자동 추측하지 않습니다. 예: ni3 hao3 → nǐ hǎo. 한 글자마다 공백을 넣어 주세요. 다독음·경성·문맥에 따른 성조 변화는 사전과 함께 확인해야 합니다. 이어 읽기 발음은 별도 입력할 수 있습니다.</p></details><details class="help-detail"><summary>자료를 계속 추가하는 방법</summary><p>상단 ‘표현 추가’에서 한자·병음·뜻을 입력하거나, ‘파일 또는 텍스트 가져오기’에 학습 자료 JSON을 붙여 넣습니다. 먼저 추가·중복 수를 확인하고 적용합니다. 이 대화에서 내용을 정리하는 것만으로 웹 앱이 자동 갱신되지는 않습니다. 새로운 자료를 명시적으로 가져와야 합니다.</p></details><details class="help-detail"><summary>학습 상태를 처음으로 돌리고 싶어요</summary><p>아래 작업은 즐겨찾기와 메모를 보존하고, ‘익혔어요·다시 보기’ 상태 및 복습 횟수만 초기화합니다. 먼저 전체 백업을 권합니다.</p><button class="btn danger sm" data-action="reset-progress">복습 기록 초기화</button></details><details class="help-detail"><summary>숨긴 기본 표현 다시 보이기</summary><p>기본 표현을 삭제하면 원본을 없애는 대신 숨깁니다. 숨긴 기본 표현 ${S.hidden.filter(id=>SEED.some(e=>e.id===id)).length}개를 다시 표시할 수 있습니다.</p><button class="btn secondary sm" data-action="unhide-seed">기본 표현 다시 표시</button></details></section>

 else{const list=t==='custom'?entries.filter(e=>S.custom.some(x=>x.id===e.id)):entries.filter(e=>S.favorites.includes(e.id));body=list.length?`<div class="word-grid" style="margin-top:20px">${list.map(wordItem).join('')}</div>`:empty(t==='custom'?'새로운 배움을 더해보세요':'다시 보고 싶은 표현을 모아보세요',t==='custom'?'한자, 성조가 있는 병음, 뜻을 입력해 학습 노트를 늘려보세요.':'단어 옆 별표를 누르면 여기에 저장됩니다.',t==='custom'?'add':'allwords',t==='custom'?'첫 표현 추가':'단어장 둘러보기');}

function openImport(){importPending=null;const body=`<div class="tipbox">새 자료는 기존 기록을 지우지 않고 합칠 수 있습니다. ‘전체 복원’만 현재 내용과 기록을 교체합니다.</div><div class="file-drop" style="margin-top:17px"><label class="small" for="import-file">JSON 파일 선택 · 최대 5MB</label><input type="file" id="import-file" accept=".json,application/json" style="margin-top:12px"></div><div class="field" style="margin-top:18px"><label for="import-text">또는 학습 자료 JSON 붙여 넣기</label><textarea id="import-text" placeholder='{"kind":"tsc-note-pack","schemaVersion":1,"entries":[…]}' style="min-height:155px" spellcheck="false"></textarea></div><div id="import-error" class="form-error" role="alert" style="margin-top:12px" hidden></div><button class="btn secondary full" data-action="import-preview" style="margin-top:13px">내용 미리 확인하기</button><div id="import-preview-area" style="margin-top:17px"></div>`;showDialog(dialogHTML('학습 자료 가져오기',body,'<button class="btn secondary" data-action="close-dialog">닫기</button>'));}
function stableHash(s){let n=2166136261;for(const c of s){n^=c.codePointAt(0);n=Math.imul(n,16777619);}return(n>>>0).toString(36);}
function prepareImport(){
 const input=$('#import-text').value,err=$('#import-error');err.hidden=true;importPending=null;
 try{if(new Blob([input]).size>5*1024*1024)throw Error('파일 또는 텍스트가 5MB를 넘습니다.');const raw=JSON.parse(input);if(!Array.isArray(raw)&&raw.schemaVersion!==undefined&&raw.schemaVersion!==1)throw Error('지원하지 않는 자료 버전입니다.');if(!Array.isArray(raw)&&raw.kind&&!['tsc-note-pack','tsc-note-backup'].includes(raw.kind))throw Error('TSC 학습 자료 또는 백업 파일이 아닙니다.');
  const data=Array.isArray(raw)?raw:raw.entries;if(!Array.isArray(data)||!data.length)throw Error('entries에 최소 하나의 학습 항목이 필요합니다.');if(data.length>5000)throw Error('한 번에 최대 5,000개 항목을 가져올 수 있습니다.');
  const seen=new Set(),seenNatural=new Set();const parsed=data.map((x,i)=>{const id=x.id||'user-import-'+stableHash(String(x.hanzi)+'|'+String(x.pinyin));const v=validateEntry({...x,id});const nk=v.hanzi+'|'+tokenizePinyin(v.pinyin).join(' ');if(seen.has(v.id)||seenNatural.has(nk))throw Error(`${i+1}번째에 중복된 ID 또는 표현이 있습니다: ${v.hanzi}`);seen.add(v.id);seenNatural.add(nk);return v;});
  const natural=new Map(entries.map(e=>[e.hanzi+'|'+tokenizePinyin(e.pinyin).join(' '),e.id]));let add=0,existing=0;
  const plan=parsed.map(e=>{const target=entryMap.has(e.id)?e.id:natural.get(e.hanzi+'|'+tokenizePinyin(e.pinyin).join(' '));if(target)existing++;else add++;return{entry:e,target:target||null};});
  let restored=null;if(raw.kind==='tsc-note-backup'){restored=hydrateState(raw.state);}
  importPending={raw,parsed,plan,restored};
  $('#import-preview-area').innerHTML=`<div class="import-preview"><strong>총 ${parsed.length}개 항목</strong><br>새로 추가 ${add}개 · 기존 표현과 일치 ${existing}개<br><span class="small">한자와 병음이 같거나 ID가 같은 항목을 비교했습니다.</span></div><label class="row small" style="margin:14px 0;align-items:flex-start"><input type="checkbox" id="import-overwrite" style="margin-top:6px;min-width:18px;height:18px;accent-color:var(--green)"><span>일치하는 기존 표현의 학습 내용도 바꾸기<br><span class="muted">개인 메모·즐겨찾기·복습 기록은 유지됩니다.</span></span></label><button class="btn primary full" data-action="import-merge">자료 합치기${icon('check')}</button>${restored?'<div class="divider"></div><p class="small muted">전체 백업 파일입니다. 아래 버튼은 현재 내용과 기록을 백업 시점으로 교체합니다. 먼저 현재 데이터를 백업해 주세요.</p><div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn secondary sm" data-action="backup">현재 내용 백업</button><button class="btn danger sm" data-action="import-restore">백업으로 전체 복원</button></div>':''}`;
 }catch(e){err.hidden=false;err.textContent=e instanceof SyntaxError?'JSON 형식을 읽지 못했습니다. 파일 내용 또는 쉼표·따옴표를 확인해 주세요.':e.message;$('#import-preview-area').innerHTML='';}
}
function mergeImport(){if(!importPending)return;const overwrite=$('#import-overwrite')?.checked;let added=0,updated=0,skipped=0;for(const {entry,target}of importPending.plan){if(target){if(overwrite){S.overrides[target]={...entry,id:target};updated++;}else skipped++;}else{const hiddenAt=S.hidden.indexOf(entry.id);if(hiddenAt>=0)S.hidden.splice(hiddenAt,1);if(SEED.some(e=>e.id===entry.id))S.overrides[entry.id]=entry;else{S.custom=S.custom.filter(e=>e.id!==entry.id);S.custom.push(entry);}added++;}}rebuild();persist();closeDialog();S.ui.category='전체';S.ui.filter='all';go('words');toast(`추가 ${added}개 · 수정 ${updated}개 · 유지 ${skipped}개. 개인 기록은 보존했습니다.`);}
function restoreImport(){if(!importPending?.restored)return;if(!confirm('현재 학습 내용, 메모, 즐겨찾기, 복습 기록을 이 백업으로 교체합니다. 계속할까요?'))return;const restored=clone(importPending.restored);for(const e of importPending.parsed){const seed=SEED.find(x=>x.id===e.id),custom=restored.custom.find(x=>x.id===e.id);if(seed){if(JSON.stringify(seed)!==JSON.stringify(e))restored.overrides[e.id]=e;}else if(custom)restored.overrides[e.id]=e;else restored.custom.push(e);}S=restored;rebuild();persist();closeDialog();S.ui.noteTab='manage';go('notes');toast('백업의 학습 내용과 개인 기록을 복원했습니다.');}
function deleteEntry(id){const isSeed=SEED.some(e=>e.id===id),e=entryMap.get(id);if(!e)return;const message=isSeed?`${e.hanzi}를 학습 목록에서 숨길까요? 메모·복습 기록은 보관됩니다.`:`${e.hanzi}와 이 표현의 메모·복습 기록을 삭제할까요?`;if(!confirm(message))return;if(isSeed){S.hidden=[...new Set([...S.hidden,id])];}else{S.custom=S.custom.filter(x=>x.id!==id);delete S.overrides[id];delete S.progress[id];delete S.notes[id];S.favorites=S.favorites.filter(x=>x!==id);}rebuild();persist();closeDialog();go('words');toast(isSeed?'기본 표현을 숨겼습니다. 설정에서 다시 표시할 수 있습니다.':'표현을 삭제했습니다.');}

  case'review-another':S.reviewSession=null;persist();render();break;
  case'note-tab':S.ui.noteTab=el.dataset.tab;persist();render();break;
  case'memo-open':showCard(id);setTimeout(()=>{const x=$('#detail-memo');if(x){x.open=true;x.scrollIntoView({behavior:'smooth',block:'center'});$('textarea',x)?.focus();}},80);break;
  case'manage':S.ui.noteTab='manage';go('notes');break;
  case'add':openEditor();break;
  case'edit':openEditor(id);break;
  case'close-dialog':closeDialog();break;
  case'insert-tone':{const field=$('#entry-pinyin');if(field){const start=field.selectionStart??field.value.length,end=field.selectionEnd??start;field.value=field.value.slice(0,start)+el.dataset.text+field.value.slice(end);field.focus();field.setSelectionRange(start+1,start+1);updatePinyinPreview();}break;}
  case'delete-entry':deleteEntry(id);break;
  case'backup':backup();break;
  case'export-pack':exportPack();break;
  case'template':examplePack();break;
  case'import':openImport();break;
  case'import-preview':prepareImport();break;
  case'import-merge':mergeImport();break;
  case'import-restore':restoreImport();break;
  case'reset-progress':if(confirm('복습 상태와 횟수를 초기화할까요? 메모와 즐겨찾기는 유지됩니다.')){S.progress={};S.daily={};S.reviewSession=null;S.quizResult=null;persist();render(true);toast('복습 기록을 초기화했습니다.');}break;
  case'unhide-seed':S.hidden=S.hidden.filter(id=>!SEED.some(e=>e.id===id));rebuild();persist();render(true);toast('숨긴 기본 표현을 다시 표시했습니다.');break;
 }
});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='word-search'){S.ui.search=el.value;persist();updateResults();}if(el.id==='entry-pinyin')updatePinyinPreview();if(el.matches('[data-memo]')){S.notes[el.dataset.memo]=el.value.slice(0,10000);const okay=persist();const st=el.nextElementSibling;if(st?.classList.contains('memo-status'))st.textContent=okay?'저장했습니다.':'저장하지 못했습니다. 종료 전 백업해 주세요.';}});
document.addEventListener('change',async event=>{const el=event.target;
 if(el.id==='word-filter'){S.ui.filter=el.value;persist();updateResults();}
 if(el.id==='large-text'){S.settings.largeText=el.checked;persist();document.body.classList.toggle('large-text',el.checked);}
 if(el.id==='dict-target'){S.settings.dictTarget=el.value==='_self'?'_self':'_blank';persist();toast('사전 열기 방식을 바꿨습니다.');}
 if(['review-filter','review-count','review-category'].includes(el.id)){const key={'review-filter':'reviewFilter','review-count':'reviewCount','review-category':'reviewCategory'}[el.id];S.ui[key]=el.value;persist();}
 if(el.id==='import-file'){const f=el.files?.[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('파일이 5MB를 넘습니다.');const text=await f.text();if(!$('#import-text'))return;$('#import-text').value=text;prepareImport();}catch(err){const box=$('#import-error');if(box){box.hidden=false;box.textContent=err.message;}}}
});
document.addEventListener('submit',event=>{if(event.target.getAttribute('id')==='entry-form'){event.preventDefault();submitEditor(event.target);}});
document.addEventListener('keydown',event=>{if($('#app-dialog').open||event.target.matches('input,textarea,select,[contenteditable=true]'))return;if(currentView==='card'&&(event.key==='ArrowRight'||event.key==='ArrowLeft')){event.preventDefault();$(`[data-action="${event.key==='ArrowRight'?'nextcard':'prevcard'}"]`)?.click();}});
$('#app-dialog').addEventListener('close',()=>{document.body.style.overflow='';});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
window.addEventListener('pagehide',rememberPosition);
window.addEventListener('pageshow',event=>{if(event.persisted)refreshStorageUI();});
window.addEventListener('storage',event=>{if(event.key===STORE_KEY&&event.newValue){try{const next=hydrateState(JSON.parse(event.newValue));if(!$('#app-dialog').open&&!document.activeElement.matches('input,textarea')){const localUI=S.ui;S=next;S.ui=localUI;suppressPersist=true;try{rebuild();render(true);}finally{suppressPersist=false;}}}catch(_){toast('다른 탭의 저장 내용을 읽지 못했습니다.',true);}}});
// All constants are initialized before hydrating existing learner data.
try{const raw=localStorage.getItem(STORE_KEY);S=raw?hydrateState(JSON.parse(raw)):clone(DEFAULT);}catch(err){S=clone(DEFAULT);storageOkay=false;storageMessage='기존 저장 데이터 또는 브라우저 저장 권한을 확인해 주세요. 내 노트에서 백업할 수 있습니다.';try{rawRecovery=localStorage.getItem(STORE_KEY)||'';}catch(_){} }
// Validate bundled content before mounting the UI.
try{SEED.forEach((e,i)=>{SEED[i]=validateEntry(e);});rebuild();if(!S.ui.lastId)S.ui.lastId='';if(!location.hash){const target=S.ui.view==='card'&&entryMap.has(S.ui.lastId)?'card/'+S.ui.lastId:['home','words','phonetics','review','notes'].includes(S.ui.view)?S.ui.view:'home';try{history.replaceState(null,'','#'+target);}catch(_){location.hash=target;}}render();const savedPos=S.ui.scrollPosition;if(savedPos?.hash===location.hash&&Number.isFinite(savedPos.y))requestAnimationFrame(()=>window.scrollTo(0,savedPos.y));}
catch(err){console.error(err);$('#main').innerHTML=`<section class="card panel"><h1>앱을 열지 못했습니다.</h1><p style="margin-top:15px">${esc(err.message)}</p><p>파일 미리보기가 아닌 실제 브라우저에서 다시 열어 주세요. 저장 데이터를 지우기 전에 백업을 보관하세요.</p></section>`;}
// A small read-only test seam; no user data is transmitted.
window.TSCNote=Object.freeze({version:VERSION,analyze,tokenizePinyin,validateEntry,dictURL,unitsFor,getStats:()=>counters(),getEntry:id=>entryMap.has(id)?clone(entryMap.get(id)):null});
})();
</script>
<script>
// 홈 화면 앱 / 오프라인 지원: service worker 등록 (file:// 로 열었을 때는 건너뜀)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
